<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Plant tissue schematic</title><desc id="desc">A schematic, not-to-scale teaching diagram of meristematic, protective, simple permanent and vascular plant tissues.</desc>
<rect width="1200" height="760" rx="24" fill="#fbfdf8"/><text x="52" y="64" font-family="system-ui,sans-serif" font-size="31" font-weight="750" fill="#193b36">PLANT TISSUES · पादप ऊतक</text><text x="54" y="96" font-family="system-ui,sans-serif" font-size="17" fill="#60756c">Schematic overview · not to scale · संरचनात्मक आरेख · पैमाने पर नहीं</text>
<g font-family="system-ui,sans-serif" fill="#173832">
<rect x="42" y="125" width="1116" height="166" rx="18" fill="#edf6df" stroke="#c8d9b9"/><text x="65" y="160" font-size="23" font-weight="700">Meristematic tissue · विभज्योतक</text><text x="65" y="188" font-size="15" fill="#49665c">Small, actively dividing cells · growing zones</text>
<g fill="#f9d879" stroke="#96762d" stroke-width="2"><rect x="72" y="213" width="38" height="38" rx="7"/><rect x="116" y="213" width="38" height="38" rx="7"/><rect x="160" y="213" width="38" height="38" rx="7"/><rect x="204" y="213" width="38" height="38" rx="7"/><rect x="248" y="213" width="38" height="38" rx="7"/></g><g fill="#845e17"><circle cx="91" cy="232" r="7"/><circle cx="135" cy="232" r="7"/><circle cx="179" cy="232" r="7"/><circle cx="223" cy="232" r="7"/><circle cx="267" cy="232" r="7"/></g><path d="M307 232h90" stroke="#579766" stroke-width="4"/><path d="m390 222 18 10-18 10" fill="none" stroke="#579766" stroke-width="4"/><text x="424" y="222" font-size="17" font-weight="650">Apical · root/shoot tips → length</text><text x="424" y="248" font-size="14" fill="#49665c">Current syllabus emphasis</text><text x="745" y="222" font-size="16" font-weight="650">Lateral → girth · Intercalary → regrowth</text><text x="745" y="248" font-size="14" fill="#49665c">Book extensions · confirm syllabus scope</text>
<rect x="42" y="310" width="1116" height="190" rx="18" fill="#f2f6f3" stroke="#d3dfd7"/><text x="65" y="347" font-size="23" font-weight="700">Simple permanent tissues · सरल स्थायी ऊतक</text>
<g stroke="#54785c" stroke-width="2"><rect x="75" y="373" width="275" height="96" rx="12" fill="#eff8e8"/><rect x="462" y="373" width="275" height="96" rx="12" fill="#edf6de"/><rect x="849" y="373" width="275" height="96" rx="12" fill="#f7eee1"/></g>
<g stroke="#699369" stroke-width="2" fill="#cce6b4"><rect x="91" y="394" width="51" height="48" rx="5"/><rect x="146" y="394" width="51" height="48" rx="5"/><rect x="201" y="394" width="51" height="48" rx="5"/><rect x="256" y="394" width="51" height="48" rx="5"/></g><g fill="#4d7656"><circle cx="116" cy="417" r="7"/><circle cx="172" cy="417" r="7"/><circle cx="226" cy="417" r="7"/><circle cx="282" cy="417" r="7"/></g><text x="91" y="488" font-size="16" font-weight="700">Parenchyma · living, thin walls</text>
<g stroke="#658550" stroke-width="4" fill="#d8e8ae"><path d="M485 442v-45q0-8 10-8h14q10 0 10 8v45z"/><path d="M527 442v-45q0-8 10-8h14q10 0 10 8v45z"/><path d="M569 442v-45q0-8 10-8h14q10 0 10 8v45z"/><path d="M611 442v-45q0-8 10-8h14q10 0 10 8v45z"/></g><text x="485" y="488" font-size="16" font-weight="700">Collenchyma · flexible support</text>
<g fill="#c6a57d" stroke="#76583b" stroke-width="5"><path d="M873 431q0-37 18-37t18 37v16h-36z"/><path d="M924 431q0-37 18-37t18 37v16h-36z"/><path d="M975 431q0-37 18-37t18 37v16h-36z"/></g><text x="871" y="488" font-size="16" font-weight="700">Sclerenchyma · thick lignified walls</text>
<rect x="42" y="520" width="1116" height="198" rx="18" fill="#edf4fb" stroke="#c8d9e6"/><text x="65" y="557" font-size="23" font-weight="700">Complex conducting tissues · जटिल संवाहक ऊतक</text>
<g fill="#d9eaf5" stroke="#668da2" stroke-width="4"><rect x="117" y="584" width="110" height="92" rx="18"/><rect x="253" y="584" width="110" height="92" rx="18"/></g><path d="M172 658V598m136 60v-60" stroke="#4285aa" stroke-width="8"/><path d="m161 606 11-15 11 15m125 0 11-15 11 15" fill="none" stroke="#4285aa" stroke-width="5"/><text x="390" y="611" font-size="20" font-weight="700">Xylem · water + minerals root → shoot</text><text x="390" y="640" font-size="15" fill="#49665c">Also contributes support; several cell types cooperate.</text>
<rect x="777" y="584" width="116" height="92" rx="16" fill="#fff0ce" stroke="#b99a5a" stroke-width="4"/><rect x="918" y="584" width="116" height="92" rx="16" fill="#fff0ce" stroke="#b99a5a" stroke-width="4"/><path d="M800 628h206" stroke="#a8741b" stroke-width="6"/><path d="m800 618-15 10 15 10m206-20 15 10-15 10" fill="none" stroke="#a8741b" stroke-width="4"/><text x="648" y="704" font-size="17" font-weight="700">Phloem · sugars between sources ↔ sinks</text>
