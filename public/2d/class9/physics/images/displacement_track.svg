<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Distance versus displacement on a straight track</title><desc id="desc">An athlete runs from O to B at 40 metres, on to A at 100 metres, then back to B. Total distance travelled is 160 metres; displacement from start to finish is plus 40 metres. Schematic, not to scale.</desc><rect width="1100" height="700" rx="24" fill="#fbfdf8"/><text x="48" y="60" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#193b36">DISTANCE vs DISPLACEMENT · दूरी बनाम विस्थापन</text><text x="50" y="92" font-family="system-ui,sans-serif" font-size="16" fill="#60756c">Athlete on a straight track · book example · schematic, not to scale</text>
<defs><marker id="aOut" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l10 5-10 5z" fill="#2c6e49"/></marker><marker id="aBack" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l10 5-10 5z" fill="#b45309"/></marker><marker id="aDisp" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l10 5-10 5z" fill="#1d4ed8"/></marker></defs>
<g stroke="#8b97a3" stroke-width="3"><path d="M110 378v24"/><path d="M286 382v16"/><path d="M462 378v24"/><path d="M638 382v16"/><path d="M814 382v16"/><path d="M990 378v24"/></g><path d="M110 390h880" stroke="#193b36" stroke-width="4"/>
<g font-family="system-ui,sans-serif" font-size="15" fill="#4a5568" text-anchor="middle"><text x="110" y="430">0 m</text><text x="286" y="430">20 m</text><text x="462" y="430">40 m</text><text x="638" y="430">60 m</text><text x="814" y="430">80 m</text><text x="990" y="430">100 m</text></g>
<g fill="#193b36"><circle cx="110" cy="390" r="9"/><circle cx="462" cy="390" r="9"/><circle cx="990" cy="390" r="9"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700" fill="#193b36" font-size="17"><text x="110" y="462">O</text><text x="462" y="462">B</text><text x="990" y="462">A</text></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="14" fill="#60756c"><text x="110" y="484">start · t = 0 s</text><text x="462" y="484">t = 4 s → 16 s</text><text x="990" y="484">turn · t = 10 s</text></g>
<path d="M110 310h872" stroke="#2c6e49" stroke-width="4" marker-end="url(#aOut)"/><text x="546" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#21553a">100 m out · O → A (passes B)</text>
<path d="M990 250H470" stroke="#b45309" stroke-width="4" marker-end="url(#aBack)"/><text x="730" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#8a4108">60 m back · A → B</text>
<path d="M110 545h344" stroke="#1d4ed8" stroke-width="4" marker-end="url(#aDisp)"/><text x="282" y="574" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1536a8">displacement = +40 m (O → B)</text>
<text x="550" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#60756c">Path length counted on the way out and back</text>
<rect x="55" y="625" width="990" height="46" rx="12" fill="#fff1d7"/><text x="550" y="654" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#614c21">Total distance = 100 + 60 = 160 m · Displacement = +40 m net change of position · equal only when there is no turning back.</text></svg>
